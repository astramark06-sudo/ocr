name: Build BatteryScope APK
on:
  workflow_dispatch:
  push:
    branches: [batteryscope]
    paths:
      - 'BatteryScope/**'
      - '.github/workflows/batteryscope-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: BatteryScope
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-debug-apk
          path: BatteryScope/app/build/outputs/apk/debug/app-debug.apk
